<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#111111"/>
  <!-- 3x3 Rubik Matrix inside -->
  <g transform="translate(106, 106)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="88" height="88" rx="16" fill="#FFFFFF"/>
    <rect x="106" y="0" width="88" height="88" rx="16" fill="#059669"/>
    <rect x="212" y="0" width="88" height="88" rx="16" fill="#FFFFFF"/>
    <!-- Row 2 -->
    <rect x="0" y="106" width="88" height="88" rx="16" fill="#D97706"/>
    <rect x="106" y="106" width="88" height="88" rx="16" fill="#059669"/>
    <rect x="212" y="106" width="88" height="88" rx="16" fill="#0284C7"/>
    <!-- Row 3 -->
    <rect x="0" y="212" width="88" height="88" rx="16" fill="#D97706"/>
    <rect x="106" y="212" width="88" height="88" rx="16" fill="#E11D48"/>
    <rect x="212" y="212" width="88" height="88" rx="16" fill="#FFFFFF"/>
  </g>
</svg>
